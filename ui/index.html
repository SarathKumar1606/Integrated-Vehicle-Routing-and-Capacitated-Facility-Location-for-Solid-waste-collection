<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Weekly collection plan — CEG Guindy</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0f1f19; --ink-2:#172e26; --ink-3:#204035;
  --paper:#f3f6f4; --paper-dim:#a9bdb5; --rule:#2b4d41;
  --r1:#3d8bd4; --r2:#e08a3c;
  --fill-lo:#4a9e63; --fill-mid:#e0b03e; --fill-hi:#c94f34;
  --ok:#5fbf85;
  font-synthesis-weight:none;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  font-family:Barlow,system-ui,sans-serif;
  background:var(--ink); color:var(--paper);
  font-variant-numeric:tabular-nums;
  -webkit-font-smoothing:antialiased;
}
.app{display:grid;grid-template-columns:352px 1fr;height:100%}

/* ---------- console ---------- */
.console{
  background:var(--ink); border-right:1px solid var(--rule);
  overflow-y:auto; display:flex; flex-direction:column;
}
.console section{padding:18px 20px;border-bottom:1px solid var(--rule)}
.console section:last-child{border-bottom:0}

h1{
  font-family:'Barlow Condensed',sans-serif; font-weight:600;
  font-size:23px; line-height:1.1; margin:0 0 2px; letter-spacing:.01em;
}
.sub{font-size:13px;color:var(--paper-dim);margin:0;line-height:1.45}

.cost{display:flex;align-items:baseline;gap:9px;margin:16px 0 10px}
.cost b{font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:46px;line-height:.9}
.cost span{font-size:13px;color:var(--paper-dim)}
.split{display:flex;gap:22px;font-size:13px}
.split div{color:var(--paper-dim)}
.split i{display:block;font-style:normal;color:var(--paper);font-size:16px;font-weight:500}

.status{display:inline-flex;align-items:center;gap:7px;font-size:13px;color:var(--ok);margin-top:12px}
.status::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--ok)}

/* ---------- day strip ---------- */
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.day{
  background:var(--ink-2);border:1px solid transparent;border-radius:3px;
  color:var(--paper-dim);font-family:'Barlow Condensed',sans-serif;font-size:15px;
  padding:9px 0 7px;cursor:pointer;text-align:center;line-height:1.15;
  transition:background .12s,color .12s;
}
.day em{display:block;font-style:normal;font-size:11px;font-family:Barlow,sans-serif;opacity:.7;margin-top:2px}
.day:hover:not(:disabled){background:var(--ink-3);color:var(--paper)}
.day[aria-pressed=true]{background:var(--paper);color:var(--ink);border-color:var(--paper)}
.day[aria-pressed=true] em{opacity:.65}
.day:disabled{opacity:.34;cursor:default}
.day:focus-visible{outline:2px solid var(--r1);outline-offset:2px}

/* ---------- routes ---------- */
.routes{display:flex;flex-direction:column;gap:8px;margin-top:4px}
.route{
  display:grid;grid-template-columns:4px 1fr auto;gap:12px;align-items:center;
  background:var(--ink-2);border:1px solid transparent;border-radius:3px;
  padding:11px 13px 11px 0;cursor:pointer;color:inherit;text-align:left;font:inherit;
}
.route:hover{background:var(--ink-3)}
.route[aria-pressed=true]{border-color:var(--paper-dim);background:var(--ink-3)}
.route:focus-visible{outline:2px solid var(--r1);outline-offset:2px}
.swatch{width:4px;height:100%;min-height:34px;border-radius:3px 0 0 3px}
.route-name{font-family:'Barlow Condensed',sans-serif;font-size:16px}
.route-meta{font-size:12.5px;color:var(--paper-dim);margin-top:1px}
.route-time{font-size:15px;text-align:right}
.route-time em{display:block;font-style:normal;font-size:11.5px;color:var(--paper-dim)}
.rest{font-size:13.5px;color:var(--paper-dim);line-height:1.5;margin:0}

/* ---------- run ---------- */
.run-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:12px}
.run-title{font-family:'Barlow Condensed',sans-serif;font-size:17px}
.run-where{font-size:12.5px;color:var(--paper-dim);max-width:190px;text-align:right;line-height:1.35}

.gauge{margin-bottom:13px}
.gauge-top{display:flex;justify-content:space-between;font-size:12.5px;color:var(--paper-dim);margin-bottom:5px}
.gauge-top b{color:var(--paper);font-weight:500;font-size:14px}
.bar{height:7px;background:var(--ink-3);border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;width:0;border-radius:4px;transition:width .1s linear}
.bar-load i{background:var(--r1)}
.bar-clock i{background:var(--paper-dim)}

.controls{display:flex;gap:8px;align-items:center}
.btn{
  font:inherit;font-size:14px;background:var(--paper);color:var(--ink);
  border:0;border-radius:3px;padding:8px 16px;cursor:pointer;min-width:74px;
}
.btn:hover{background:#fff}
.btn:focus-visible{outline:2px solid var(--r1);outline-offset:2px}
.btn.ghost{background:transparent;color:var(--paper-dim);border:1px solid var(--rule);min-width:0;padding:8px 11px}
.btn.ghost:hover{color:var(--paper);border-color:var(--paper-dim)}
.btn.ghost[aria-pressed=true]{background:var(--ink-3);color:var(--paper);border-color:var(--paper-dim)}
.scrub{flex:1;accent-color:var(--paper);cursor:pointer}

/* ---------- legend ---------- */
.legend-row{display:flex;align-items:center;gap:9px;font-size:12.5px;color:var(--paper-dim);margin-top:9px}
.ramp{height:7px;flex:1;border-radius:4px;background:linear-gradient(90deg,var(--fill-lo),var(--fill-mid),var(--fill-hi))}
.note{font-size:12px;color:var(--paper-dim);line-height:1.5;margin:14px 0 0}

/* ---------- map ---------- */
#map{height:100%;background:#dfe6e2}
.leaflet-container{font-family:Barlow,sans-serif}
.leaflet-popup-content-wrapper{border-radius:4px}
.leaflet-popup-content{margin:12px 14px;font-size:13px;line-height:1.5;min-width:190px}
.pop-t{font-family:'Barlow Condensed',sans-serif;font-size:16px;color:#0f1f19;margin-bottom:5px}
.pop-r{display:flex;justify-content:space-between;gap:16px;color:#5a6b64}
.pop-r b{color:#0f1f19;font-weight:500}
.pop-week{display:flex;gap:3px;margin-top:9px}
.pop-week i{flex:1;height:22px;border-radius:2px;font-style:normal;font-size:9px;
  display:flex;align-items:flex-end;justify-content:center;color:#fff;padding-bottom:2px}
.stop-label{
  background:#0f1f19;color:#f3f6f4;border-radius:50%;width:19px;height:19px;
  font-size:11px;display:flex;align-items:center;justify-content:center;
  font-weight:500;box-shadow:0 0 0 2px #f3f6f4;
}
.truck{
  width:26px;height:26px;border-radius:50%;background:var(--ink);
  box-shadow:0 0 0 3px #f3f6f4,0 2px 8px rgba(0,0,0,.35);
  display:flex;align-items:center;justify-content:center;font-size:14px;
}

@media (prefers-reduced-motion:reduce){.bar i{transition:none}}
@media (max-width:860px){
  .app{grid-template-columns:1fr;grid-template-rows:auto 60vh}
  .console{border-right:0;border-bottom:1px solid var(--rule)}
}
</style>
</head>
<body>
<div class="app">
  <aside class="console">

    <section>
      <h1>Weekly collection plan</h1>
      <p class="sub">CEG Guindy corridor, Chennai · 21 collection points</p>
      <div class="cost"><b id="cost-overall">—</b><span>US$ per week</span></div>
      <div class="split">
        <div>Bins<i id="cost-bin">—</i></div>
        <div>Collection<i id="cost-route">—</i></div>
        <div>Routes<i id="cost-routes">—</i></div>
      </div>
      <div class="status" id="feasible">All limits respected</div>
    </section>

    <section>
      <div class="days" id="days"></div>
    </section>

    <section>
      <div id="routes"></div>
    </section>

    <section id="run-panel">
      <div class="run-head">
        <span class="run-title">Truck run</span>
        <span class="run-where" id="run-where">Pick a route above</span>
      </div>
      <div class="gauge">
        <div class="gauge-top"><span>Load</span><span><b id="g-load">0.0</b> / <span id="g-cap">21</span> m³</span></div>
        <div class="bar bar-load"><i id="bar-load"></i></div>
      </div>
      <div class="gauge">
        <div class="gauge-top"><span>Elapsed</span><span><b id="g-time">0</b> / <span id="g-shift">98</span> min shift</span></div>
        <div class="bar bar-clock"><i id="bar-clock"></i></div>
      </div>
      <div class="controls">
        <button class="btn" id="play">Play</button>
        <input class="scrub" id="scrub" type="range" min="0" max="1000" value="0" aria-label="Position along route">
        <button class="btn ghost" id="speed">1×</button>
      </div>
    </section>

    <section>
      <button class="btn ghost" id="fill-toggle" aria-pressed="false" style="width:100%">Show how full the bins are</button>
      <div class="legend-row" id="fill-legend" hidden>
        <span>Empty</span><span class="ramp"></span><span>Full</span>
      </div>
      <button class="btn ghost" id="basemap" style="width:100%;margin-top:9px">Map style</button>
      <p class="note" id="footnote"></p>
    </section>

  </aside>
  <main id="map"></main>
</div>

              ],

                80.219717,

          },

    {

      "rest_day": true,

    }
  ],
  "costs": {
    "currency": "US$",
    "bin_cost": 69.89,
    "routing_cost": 153.8296,
    "overall_cost": 223.7196,
    "penalty": 0.0,
    "fitness": 223.7196,
    "feasible": true,

    "total_route_minutes": 266.88,

  "provenance": {
    "solution_file": "results/solutions/chennai_guindy_sa_seed28.npz",

;

/* ---------------- setup ---------------- */
const DAYS = DATA.days;
const ROUTE_COLORS = ['#3d8bd4', '#e08a3c', '#7d63c4', '#39a08a'];
const map = L.map('map', { zoomControl: false, attributionControl: true });
L.control.zoom({ position: 'bottomright' }).addTo(map);
/* Basemap. OpenStreetMap's own servers refuse file:// requests (403) and CARTO
   now watermarks unkeyed use, so these are Esri's key-free tile services. The
   "Map style" button cycles them in case one is ever unreachable. */
const BASEMAPS = [
  { name: 'Streets',
    url: 'https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}',
    opts: { maxZoom: 19, attribution: 'Tiles &copy; Esri · routing by OSRM' } },
  { name: 'Plain',
    url: 'https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Light_Gray_Base/MapServer/tile/{z}/{y}/{x}',
    opts: { maxZoom: 16, attribution: 'Tiles &copy; Esri · routing by OSRM' } },
  { name: 'Satellite',
    url: 'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
    opts: { maxZoom: 19, attribution: 'Imagery &copy; Esri · routing by OSRM' } },
  { name: 'OpenStreetMap',
    url: 'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
    opts: { maxZoom: 19, attribution: '&copy; OpenStreetMap contributors · routing by OSRM' } }
];
let baseLayer = null, baseIndex = 0;
function useBasemap(i) {
  if (baseLayer) map.removeLayer(baseLayer);
  baseIndex = (i + BASEMAPS.length) % BASEMAPS.length;
  baseLayer = L.tileLayer(BASEMAPS[baseIndex].url, BASEMAPS[baseIndex].opts).addTo(map);
  baseLayer.bringToBack();
  const btn = document.getElementById('basemap');
  if (btn) btn.textContent = 'Map style: ' + BASEMAPS[baseIndex].name;
}
useBasemap(0);

const layers = { routes: L.layerGroup().addTo(map), points: L.layerGroup().addTo(map), truck: null };

let dayIndex = DAYS.findIndex(d => !d.rest_day);
let routeIndex = 0;
let showFill = false;
let playing = false;
let speed = 1;
let t = 0;               // model minutes into the current route
let lastFrame = null;

/* ---------------- headline ---------------- */
const c = DATA.costs;
document.getElementById('cost-overall').textContent = c.overall_cost.toFixed(2);
document.getElementById('cost-bin').textContent = c.bin_cost.toFixed(2);
document.getElementById('cost-route').textContent = c.routing_cost.toFixed(2);
document.getElementById('cost-routes').textContent = c.n_routes;
document.getElementById('g-cap').textContent = DATA.instance.vehicle_capacity_m3;
document.getElementById('g-shift').textContent = DATA.instance.shift_length_min;
if (!c.feasible) {
  const el = document.getElementById('feasible');
  el.textContent = c.violations.join('; ') || 'Limits exceeded';
  el.style.color = '#c94f34';
  el.style.setProperty('--ok', '#c94f34');
}
document.getElementById('footnote').textContent =
  `Travel times from OpenStreetMap road routing, without traffic. Fleet of ${DATA.instance.fleet_size}, ` +
  `${DATA.instance.vehicle_capacity_m3} m³ each, ${DATA.instance.shift_length_min}-minute shift. ` +
  `Depot: ${DATA.depot.name}.`;

/* ---------------- geometry helpers ---------------- */
function prepare(route) {
  if (route._ready) return route;
  const coords = route.geometry.coordinates.map(([lon, lat]) => [lat, lon]);
  const cum = [0];
  for (let i = 1; i < coords.length; i++) {
    cum.push(cum[i - 1] + map.distance(coords[i - 1], coords[i]));
  }
  // nearest geometry vertex to each stop, kept monotonic along the path
  const marks = [];
  let from = 0;
  for (const s of route.stops) {
    let best = from, bestD = Infinity;
    for (let i = from; i < coords.length; i++) {
      const d = (coords[i][0] - s.lat) ** 2 + (coords[i][1] - s.lon) ** 2;
      if (d < bestD) { bestD = d; best = i; }
    }
    marks.push(best);
    from = best;
  }
  // keyframes: depot, each stop, depot
  const keys = [{ idx: 0, arrive: 0, depart: 0 }];
  route.stops.forEach((s, k) => keys.push({ idx: marks[k], arrive: s.arrive_min, depart: s.depart_min }));
  const backAtDepot = route.travel_min + route.service_min;
  keys.push({ idx: coords.length - 1, arrive: backAtDepot, depart: route.duration_min });

  Object.assign(route, { _ready: true, _coords: coords, _cum: cum, _keys: keys });
  return route;
}

function atTime(route, time) {
  const { _coords: co, _cum: cum, _keys: keys } = route;
  for (let k = 0; k < keys.length; k++) {
    const a = keys[k];
    if (time <= a.depart) {                       // waiting at a stop (or depot)
      return { pos: co[a.idx], stopsDone: k, servicing: k > 0 && k < keys.length - 1 && time >= a.arrive };
    }
    const b = keys[k + 1];
    if (!b) return { pos: co[co.length - 1], stopsDone: keys.length - 1, servicing: false };
    if (time < b.arrive) {                        // driving between a and b
      const f = (time - a.depart) / Math.max(b.arrive - a.depart, 1e-9);
      const target = cum[a.idx] + f * (cum[b.idx] - cum[a.idx]);
      let i = a.idx;
      while (i < b.idx && cum[i + 1] < target) i++;
      const span = cum[i + 1] - cum[i];
      const g = span > 0 ? (target - cum[i]) / span : 0;
      const p = [co[i][0] + (co[i + 1][0] - co[i][0]) * g, co[i][1] + (co[i + 1][1] - co[i][1]) * g];
      return { pos: p, stopsDone: k, servicing: false };
    }
  }
  return { pos: co[co.length - 1], stopsDone: keys.length - 1, servicing: false };
}

/* ---------------- bin fill colour ---------------- */
function fillColor(ratio) {
  const stops = [[0, [74, 158, 99]], [0.6, [224, 176, 62]], [1, [201, 79, 52]]];
  const r = Math.max(0, Math.min(1, ratio));
  for (let i = 1; i < stops.length; i++) {
    if (r <= stops[i][0]) {
      const [p0, c0] = stops[i - 1], [p1, c1] = stops[i];
      const f = (r - p0) / (p1 - p0);
      return `rgb(${c0.map((v, j) => Math.round(v + (c1[j] - v) * f)).join(',')})`;
    }
  }
  return 'rgb(201,79,52)';
}

/* ---------------- drawing ---------------- */
function drawDay() {
  layers.routes.clearLayers();
  layers.points.clearLayers();
  const day = DAYS[dayIndex];
  const todayStops = new Set();
  day.routes.forEach(r => r.stops.forEach(s => todayStops.add(s.point_id)));

  // collection points
  DATA.points.forEach(p => {
    const f = p.fill[dayIndex];
    const onToday = todayStops.has(p.id);
    const color = showFill ? fillColor(f.fill_ratio) : (onToday ? '#0f1f19' : '#8ea79d');
    L.circleMarker([p.lat, p.lon], {
      radius: showFill ? 5 + f.fill_ratio * 6 : (onToday ? 7 : 5),
      color: '#f3f6f4', weight: 2, fillColor: color, fillOpacity: .92
    }).bindPopup(popup(p, f), { closeButton: false }).addTo(layers.points);
  });

  // depot
  L.marker([DATA.depot.lat, DATA.depot.lon], {
    icon: L.divIcon({ className: '', iconSize: [26, 26], iconAnchor: [13, 13],
      html: '<div class="truck" style="font-size:12px">D</div>' })
  }).bindPopup(`<div class="pop-t">${DATA.depot.name}</div>
    <div class="pop-r"><span>Waste unloaded here</span></div>`, { closeButton: false })
    .addTo(layers.points);

  // routes
  day.routes.forEach((route, i) => {
    prepare(route);
    const color = ROUTE_COLORS[i % ROUTE_COLORS.length];
    const active = i === routeIndex;
    L.polyline(route._coords, {
      color, weight: active ? 5 : 3, opacity: active ? .95 : .35, lineJoin: 'round'
    }).addTo(layers.routes);
    if (active) {
      route.stops.forEach(s => {
        L.marker([s.lat, s.lon], {
          icon: L.divIcon({ className: '', iconSize: [19, 19], iconAnchor: [9, 9],
            html: `<div class="stop-label">${s.order}</div>` })
        }).bindPopup(stopPopup(s, route), { closeButton: false }).addTo(layers.routes);
      });
    }
  });

  const active = day.routes[routeIndex];
  if (active) map.fitBounds(L.latLngBounds(active._coords).pad(0.12));
  else map.setView([13.005, 80.243], 12);

  layers.truck = null;
  t = 0;
  tick(true);
}

function popup(p, f) {
  const week = p.fill.map(x =>
    `<i style="background:${fillColor(x.fill_ratio)}" title="${x.day} ${x.waste_m3} m³">${x.day[0]}</i>`).join('');
  return `<div class="pop-t">${p.name}</div>
    <div class="pop-r"><span>Bin installed</span><b>${p.bin.capacity_m3} m³</b></div>
    <div class="pop-r"><span>Waste per day</span><b>${p.waste_m3_per_day} m³</b></div>
    <div class="pop-r"><span>Collected</span><b>${p.collection_days.join(', ')}</b></div>
    <div class="pop-r"><span>${f.day} · in the bin</span><b>${f.waste_m3} m³ (${Math.round(f.fill_ratio * 100)}%)</b></div>
    <div class="pop-week">${week}</div>`;
}

function stopPopup(s, route) {
  return `<div class="pop-t">${s.order}. ${s.name}</div>
    <div class="pop-r"><span>Picked up</span><b>${s.load_m3} m³</b></div>
    <div class="pop-r"><span>Truck carrying</span><b>${s.cum_load_m3} of ${route.vehicle_capacity_m3} m³</b></div>
    <div class="pop-r"><span>Arrives</span><b>${s.arrive_min} min in</b></div>`;
}

/* ---------------- panels ---------------- */
function drawDays() {
  const host = document.getElementById('days');
  host.innerHTML = '';
  DAYS.forEach((d, i) => {
    const b = document.createElement('button');
    b.className = 'day';
    b.setAttribute('aria-pressed', i === dayIndex);
    b.disabled = d.rest_day;
    b.innerHTML = `${d.day}<em>${d.rest_day ? '—' : d.n_routes + (d.n_routes === 1 ? ' run' : ' runs')}</em>`;
    b.onclick = () => { dayIndex = i; routeIndex = 0; playing = false; drawDays(); drawRoutes(); drawDay(); };
    host.appendChild(b);
  });
}

function drawRoutes() {
  const host = document.getElementById('routes');
  const day = DAYS[dayIndex];
  host.innerHTML = '';
  if (!day.routes.length) {
    host.innerHTML = `<p class="rest">No collection on ${day.day}. Drivers rest, and waste keeps building up
      at every point — which is why bins must hold two days by Monday morning.</p>`;
    document.getElementById('run-panel').style.opacity = .4;
    return;
  }
  document.getElementById('run-panel').style.opacity = 1;
  const wrap = document.createElement('div');
  wrap.className = 'routes';
  day.routes.forEach((r, i) => {
    const b = document.createElement('button');
    b.className = 'route';
    b.setAttribute('aria-pressed', i === routeIndex);
    b.innerHTML = `<span class="swatch" style="background:${ROUTE_COLORS[i % ROUTE_COLORS.length]}"></span>
      <span><span class="route-name">Run ${r.route}</span>
        <span class="route-meta">${r.n_stops} stops · ${r.total_load_m3} m³ · ${r.road_distance_km} km</span></span>
      <span class="route-time">${r.duration_min}<em>minutes</em></span>`;
    b.onclick = () => { routeIndex = i; playing = false; setPlayLabel(); drawRoutes(); drawDay(); };
    wrap.appendChild(b);
  });
  host.appendChild(wrap);
}

/* ---------------- animation ---------------- */
function current() { return DAYS[dayIndex].routes[routeIndex]; }

function tick(force) {
  const route = current();
  const where = document.getElementById('run-where');
  if (!route) {
    where.textContent = 'No collection today';
    setBar('bar-load', 0); setBar('bar-clock', 0);
    document.getElementById('g-load').textContent = '0.0';
    document.getElementById('g-time').textContent = '0';
    return;
  }
  const { pos, stopsDone, servicing } = atTime(route, t);

  if (!layers.truck) {
    layers.truck = L.marker(pos, {
      icon: L.divIcon({ className: '', iconSize: [26, 26], iconAnchor: [13, 13],
        html: '<div class="truck">▮</div>' }), zIndexOffset: 1000
    }).addTo(map);
  } else layers.truck.setLatLng(pos);

  const done = Math.min(stopsDone, route.stops.length);
  const load = done > 0 ? route.stops[done - 1].cum_load_m3 : 0;
  document.getElementById('g-load').textContent = load.toFixed(1);
  document.getElementById('g-time').textContent = Math.round(t);
  setBar('bar-load', load / route.vehicle_capacity_m3);
  setBar('bar-clock', t / DATA.instance.shift_length_min);

  if (t >= route.duration_min) where.textContent = `Back at the depot, ${route.duration_min} min`;
  else if (stopsDone === 0) where.textContent = 'Leaving the depot';
  else if (stopsDone > route.stops.length) where.textContent = 'Returning to unload';
  else {
    const s = route.stops[Math.min(done, route.stops.length) - 1];
    where.textContent = (servicing ? 'Emptying bins at ' : 'Left ') + s.name;
  }
  if (force) document.getElementById('scrub').value = Math.round(t / route.duration_min * 1000);
}

function setBar(id, ratio) {
  const el = document.getElementById(id);
  el.style.width = Math.min(1, Math.max(0, ratio)) * 100 + '%';
  if (id === 'bar-load') el.style.background = ratio > 0.97 ? '#c94f34' : 'var(--r1)';
  if (id === 'bar-clock') el.style.background = ratio > 1 ? '#c94f34' : 'var(--paper-dim)';
}

function frame(now) {
  if (playing) {
    const route = current();
    if (route) {
      if (lastFrame) t += (now - lastFrame) / 1000 * 4 * speed;   // 4 model-minutes per second at 1x
      if (t >= route.duration_min) { t = route.duration_min; playing = false; setPlayLabel(); }
      document.getElementById('scrub').value = Math.round(t / route.duration_min * 1000);
      tick(false);
    }
  }
  lastFrame = now;
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

function setPlayLabel() {
  const route = current();
  document.getElementById('play').textContent =
    playing ? 'Pause' : (route && t >= route.duration_min ? 'Replay' : 'Play');
}

/* ---------------- controls ---------------- */
document.getElementById('play').onclick = () => {
  const route = current();
  if (!route) return;
  if (t >= route.duration_min) t = 0;
  playing = !playing;
  setPlayLabel();
};
document.getElementById('scrub').oninput = e => {
  const route = current();
  if (!route) return;
  playing = false; setPlayLabel();
  t = e.target.value / 1000 * route.duration_min;
  tick(false);
};
document.getElementById('speed').onclick = e => {
  speed = speed === 1 ? 2 : speed === 2 ? 4 : 1;
  e.target.textContent = speed + '×';
};
document.getElementById('fill-toggle').onclick = e => {
  showFill = !showFill;
  e.target.setAttribute('aria-pressed', showFill);
  e.target.textContent = showFill ? 'Hide bin fill levels' : 'Show how full the bins are';
  document.getElementById('fill-legend').hidden = !showFill;
  drawDay();
};
document.getElementById('basemap').onclick = () => useBasemap(baseIndex + 1);
document.addEventListener('keydown', e => {
  if (e.key === ' ' && e.target.tagName !== 'INPUT') { e.preventDefault(); document.getElementById('play').click(); }
  if (e.key === 'ArrowRight') { const n = DAYS.findIndex((d, i) => i > dayIndex && !d.rest_day); if (n >= 0) { dayIndex = n; routeIndex = 0; drawDays(); drawRoutes(); drawDay(); } }
  if (e.key === 'ArrowLeft') { for (let i = dayIndex - 1; i >= 0; i--) if (!DAYS[i].rest_day) { dayIndex = i; routeIndex = 0; drawDays(); drawRoutes(); drawDay(); break; } }
});

/* ---------------- go ---------------- */
drawDays(); drawRoutes(); drawDay(); setPlayLabel(); useBasemap(baseIndex);
</script>
